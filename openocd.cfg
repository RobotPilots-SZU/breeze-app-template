###################################  STM32H7  #########################################

source [find target/stm32h7x.cfg]

adapter speed 1000

# Zephyr on STM32H7 typically places SRAM at 0x2400_0000.
# RTT control block (_SEGGER_RTT) is expected in RAM section,
# so search in the main SRAM window for reliable attach.
set _rtt_started 0

# 自动档
# proc setup_rtt {} {
#     global _rtt_started
#     if {$_rtt_started} {
#         return
#     }
#     if { [catch {rtt start} err] } {
# 		echo "RTT: control block not found yet, will retry on next halt ($err)"
# 	} else {
# 		set _rtt_started 1
# 		echo "RTT: started successfully"
# 	}
#     set _rtt_started 1
# }

proc setup_rtt {} {
	global _rtt_started
	if {$_rtt_started} {
		return
	}
	echo "RTT: setup search in SRAM (0x24000000)"
	# Scan a window large enough for RTT control block and buffers.
	rtt setup 0x24000000 0x40000 "SEGGER RTT"
	if { [catch {rtt start} err] } {
		echo "RTT: control block not found yet, will retry on next halt ($err)"
	} else {
		set _rtt_started 1
		echo "RTT: started successfully"
	}
}

# Configure RTT only once for the CPU target.
proc configure_rtt_for_cpu {} {
	echo "Configuring RTT for CPU target..."

	# Configure RTT event handlers on CPU target.
	stm32h7x.cpu0 configure -event gdb-attach {
		echo "GDB attached - setting up RTT..."
		setup_rtt
	}

	stm32h7x.cpu0 configure -event reset-init {
		echo "Reset-init: Setting up RTT..."
		setup_rtt
	}

	# When using runToEntryPoint=main, CPU may halt after init.
	# Re-configure RTT here to improve control block detection.
	stm32h7x.cpu0 configure -event halted {
		echo "CPU halted: Setting up RTT..."
		setup_rtt
	}
}
###################################  STM32H7  END #########################################
